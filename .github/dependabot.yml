version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by eslint-config-next) does not support
      # TypeScript 7 yet, and `npm run lint` fails with it. Remove this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Tauri desktop companion
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: monthly
