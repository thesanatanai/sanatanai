version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Tauri desktop companion
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: monthly
