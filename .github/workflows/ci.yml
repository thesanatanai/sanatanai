name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Newer commits on a pull request replace older runs; other runs never cancel.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder values. The app validates its environment when it loads, but CI
  # never talks to Gemini, Tavily, Resend, Google or MongoDB for real.
  NEXT_PUBLIC_OAUTH_CLIENT_ID: ci-google-client-id
  MONGO_URI: mongodb://127.0.0.1:27017/ci
  JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
  GENAI: ci-genai-key
  TAVILY_API: ci-tavily-key
  RESEND_API: re_ci_key

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 24 (see .nvmrc) ships npm 11. The committed package-lock.json is
      # written by a recent npm, and `npm ci` on npm 10 (Node 20/22) reports it
      # as out of sync, so do not lower this version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run tests with coverage (thresholds are enforced)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const total = require("./coverage/coverage-summary.json").total;
              console.log("### Test coverage\n");
              console.log("| Metric | Covered | Count |\n| --- | --- | --- |");
              for (const key of ["statements", "branches", "functions", "lines"]) {
                const { pct, covered, total: count } = total[key];
                console.log(`| ${key} | ${pct}% | ${covered} / ${count} |`);
              }
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build (also type-checks the tests)
        run: npm run build
      - name: Smoke test the production server
        run: npm run test:smoke

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Reports known advisories in production dependencies without failing the
      # build, so an upstream advisory never blocks unrelated work. Tighten this
      # once the existing findings are resolved.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high || echo "::warning title=npm audit::High severity advisories were found in production dependencies. See this job's log."

  # One stable check name for branch protection ("Require status checks").
  ci-passed:
    name: CI passed
    if: always()
    needs: [static, unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
